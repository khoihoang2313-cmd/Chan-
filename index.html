<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">
<title>UTRALOCK</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070707;
  color:#fff;
  min-height:100vh;
}

/* ================= KEY LOGIN ================= */

#keyLogin{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#070707;
}

.login-box{
  width:100%;
  max-width:380px;
  padding:26px;
  text-align:center;
  background:#111;
  border:1px solid #292929;
  border-radius:20px;
  box-shadow:0 15px 50px #000;
}

.login-logo{
  width:76px;
  height:76px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:linear-gradient(135deg,#fff,#444);
  color:#000;
  font-size:27px;
  font-weight:900;
  box-shadow:0 0 25px #444;
}

.login-box h1{
  margin-top:14px;
  letter-spacing:2px;
}

.login-box p{
  margin:7px 0 20px;
  color:#777;
  font-size:11px;
}

.login-box input{
  width:100%;
  padding:14px;
  border-radius:11px;
  border:1px solid #333;
  background:#191919;
  color:#fff;
  outline:none;
  text-align:center;
}

.login-box button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

#error{
  min-height:18px;
  margin-top:10px;
  color:#ff5555;
  font-size:11px;
}

/* ================= APP ================= */

.app{
  display:none;
  max-width:460px;
  margin:auto;
  padding:18px;
}

header{
  text-align:center;
  padding:15px 0 22px;
}

.logo{
  width:78px;
  height:78px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:linear-gradient(135deg,#fff,#444);
  color:#000;
  font-size:27px;
  font-weight:900;
  box-shadow:0 0 30px #444;
}

header h1{
  margin-top:12px;
  font-size:26px;
  letter-spacing:2px;
}

.sub{
  margin-top:5px;
  color:#777;
  font-size:11px;
}

/* ================= NAV ================= */

.nav{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.nav button{
  flex:1;
  padding:11px 5px;
  border-radius:10px;
  border:1px solid #333;
  background:#151515;
  color:#fff;
  cursor:pointer;
}

.nav button.active{
  background:#fff;
  color:#000;
}

/* ================= CARDS ================= */

.card{
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 8px 25px #000;
}

.title{
  font-size:13px;
  font-weight:bold;
  margin-bottom:13px;
  color:#ddd;
}

/* ================= BUTTONS ================= */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.btn{
  min-height:61px;
  padding:11px 9px;
  border-radius:12px;
  border:1px solid #303030;
  background:#191919;
  color:#eee;
  cursor:pointer;
  text-align:left;
  transition:.18s;
}

.btn:active{
  transform:scale(.97);
}

.btn.active{
  background:#eee;
  color:#000;
  border-color:#fff;
  box-shadow:0 0 18px #666;
}

.btn b{
  display:block;
  font-size:12px;
}

.btn span{
  display:block;
  margin-top:5px;
  font-size:9px;
  color:#777;
}

.btn.active span{
  color:#333;
}

/* ================= TUNING ================= */

.boost{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin:5px 0 18px;
}

.range{
  margin:17px 0;
}

.range-head{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  margin-bottom:7px;
}

input[type=range]{
  width:100%;
  accent-color:#fff;
}

.action{
  width:100%;
  margin-top:10px;
  padding:13px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

/* ================= ADMIN ================= */

.status{
  padding:11px;
  border-radius:10px;
  background:#191919;
  border:1px solid #292929;
  font-size:11px;
  margin-bottom:10px;
}

.status.ok{
  border-color:#fff;
}

.admin-input,
select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #333;
  background:#191919;
  color:#fff;
  outline:none;
}

.key-result{
  display:none;
  margin-top:12px;
  padding:12px;
  border:1px dashed #555;
  border-radius:10px;
  text-align:center;
  font-family:monospace;
  font-size:12px;
  word-break:break-all;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.footer{
  text-align:center;
  color:#555;
  font-size:9px;
  padding:10px;
}
</style>
</head>

<body>


<!-- ==================================================
     ACCESS KEY
================================================== -->

<div id="keyLogin">

  <div class="login-box">

    <div class="login-logo">UL</div>

    <h1>UTRALOCK</h1>

    <p>NHẬP ACCESS KEY ĐỂ VÀO APP</p>

    <input
      id="accessKey"
      type="text"
      placeholder="Nhập Key..."
      autocomplete="off"
    >

    <button onclick="unlockApp()">
      VÀO UTRALOCK
    </button>

    <div id="error"></div>

  </div>

</div>


<!-- ==================================================
     MAIN APP
================================================== -->

<div id="app" class="app">

<header>

  <div class="logo">UL</div>

  <h1>UTRALOCK</h1>

  <div class="sub">
    CONTROL PANEL • 2026
  </div>

</header>


<div class="nav">

  <button
    class="active"
    onclick="showPage('main',this)">
    CONTROL
  </button>

  <button
    onclick="showPage('tune',this)">
    TUNING
  </button>

  <button
    onclick="showPage('admin',this)">
    ADMIN
  </button>

</div>


<!-- ==================================================
     CONTROL
================================================== -->

<section id="main" class="page active">

<div class="card">

<div class="title">
AIM FUNCTIONS
</div>

<div class="grid">

<button class="btn">
<b>AimLock Head</b>
<span>Khóa vùng ngắm</span>
</button>

<button class="btn">
<b>Bám Đầu</b>
<span>Ổn định hướng ngắm</span>
</button>

<button class="btn">
<b>Stability Assist</b>
<span>Hỗ trợ ổn định</span>
</button>

<button class="btn">
<b>Nhẹ Tâm</b>
<span>Điều chỉnh tâm</span>
</button>

<button class="btn">
<b>Aim Hold</b>
<span>Giữ trạng thái</span>
</button>

<button class="btn">
<b>Ghìm Tâm</b>
<span>Ổn định tâm</span>
</button>

<button class="btn">
<b>Aim LockDown</b>
<span>Khóa trạng thái</span>
</button>

<button class="btn">
<b>Đàm Tâm</b>
<span>Tinh chỉnh tâm</span>
</button>

<button class="btn">
<b>Sensitivity Boost</b>
<span>Tăng độ nhạy</span>
</button>

<button class="btn">
<b>Screen Boost</b>
<span>Buff màn</span>
</button>

<button class="btn">
<b>HeadShot Fix</b>
<span>Điều chỉnh vùng đầu</span>
</button>

<button class="btn">
<b>AimFlow</b>
<span>Ổn định chuyển động</span>
</button>

<button class="btn">
<b>HeadLock</b>
<span>Ổn định vùng ngắm</span>
</button>

<button class="btn">
<b>DragBoost</b>
<span>Tăng tốc độ kéo</span>
</button>

<button class="btn">
<b>AimSnap</b>
<span>Phản hồi nhanh</span>
</button>

<button class="btn">
<b>Crosshair Pro</b>

</button>

<button class="btn">
<b>FlickAssist</b>
<span>Hỗ trợ phản xạ</span>
</button>

<button class="btn">
<b>AimTrack</b>
<span>Theo dõi chuyển động</span>
</button>

<button class="btn">
<b>DragSync</b>

</button>

<button class="btn">
<b>Precision Drag</b>
<span>Độ chính xác</span>
</button>

</div>
</div>

</section>


<!-- ==================================================
     TUNING
================================================== -->

<section id="tune" class="page">

<div class="card">

<div class="title">
TINH CHỈNH ĐỘ NHẠY & BOOST
</div>

<div class="boost">
<span id="boost">0</span>%
</div>


<div class="range">

<div class="range-head">
<span>Sensitivity</span>
<span id="sensV">0%</span>
</div>

<input
 id="sens"
 type="range"
 min="0"
 max="100"
 value="0">

</div>


<div class="range">

<div class="range-head">
<span>Shake Fix</span>
<span id="shakeV">0%</span>
</div>

<input
 id="shake"
 type="range"
 min="0"
 max="100"
 value="0">

</div>


<div class="range">

<div class="range-head">
<span>Overshoot Fix</span>
<span id="overV">0%</span>
</div>

<input
 id="over"
 type="range"
 min="0"
 max="100"
 value="0">

</div>


<div class="range">

<div class="range-head">
<span>Head Lock</span>
<span id="headV">0%</span>
</div>

<input
 id="head"
 type="range"
 min="0"
 max="100"
 value="0">

</div>


<div class="range">

<div class="range-head">
<span>Aim Control</span>
<span id="aimV">0%</span>
</div>

<input
 id="aim"
 type="range"
 min="0"
 max="100"
 value="0">

</div>


<button class="action" onclick="resetTune()">
RESET TUNING
</button>

</div>

</section>


<!-- ==================================================
     ADMIN
================================================== -->

<section id="admin" class="page">

<div class="card">

<div class="title">
ADMIN KEY MANAGER
</div>

<div
  class="status"
  id="status">
🔒 Admin chưa xác thực
</div>

<input
  class="admin-input"
  id="adminKey"
  type="text"
  placeholder="Nhập Admin Key">

<button
  class="action"
  onclick="verifyAdmin()">
XÁC THỰC ADMIN
</button>


<div
  id="adminPanel"
  style="display:none;margin-top:15px">

<div class="title">
TẠO KEY TRUY CẬP
</div>

<select id="duration">

<option value="1h">
1 giờ
</option>

<option value="12h">
12 giờ
</option>

<option value="1d">
1 ngày
</option>

<option value="7d">
7 ngày
</option>

<option value="1m">
1 tháng
</option>

<option value="1y">
1 năm
</option>

</select>


<button
  class="action"
  onclick="generateKey()">
+ TẠO KEY
</button>


<div
  class="key-result"
  id="result">
</div>

</div>

</div>

</section>


<div class="footer">
UTRALOCK • ADMIN CONTROL • 2026
</div>

</div>


<script>

/* ==================================================
   ACCESS KEY
================================================== */

/*
  KEY DEMO CHO NGƯỜI DÙNG
*/
const ACCESS_KEY = "UTRA-HKHOI";


function unlockApp(){

  const input =
    document.getElementById("accessKey")
    .value.trim();

  const error =
    document.getElementById("error");


  if(input === ACCESS_KEY){

    document.getElementById("keyLogin")
      .style.display="none";

    document.getElementById("app")
      .style.display="block";

    sessionStorage.setItem(
      "utralock_access",
      "granted"
    );

  }else{

    error.textContent =
      "✕ Access Key không hợp lệ";

  }
}


/* ==================================================
   BUTTON SYSTEM
================================================== */

document.querySelectorAll(".btn")
.forEach(btn=>{

  btn.addEventListener("click",()=>{

    btn.classList.toggle("active");

  });

});


/* ==================================================
   PAGE SYSTEM
================================================== */

function showPage(id,button){

  document.querySelectorAll(".page")
  .forEach(page=>{
    page.classList.remove("active");
  });

  document.querySelectorAll(".nav button")
  .forEach(btn=>{
    btn.classList.remove("active");
  });

  document.getElementById(id)
    .classList.add("active");

  button.classList.add("active");

}


/* ==================================================
   TUNING
================================================== */

const tuning=[

  ["sens","sensV"],
  ["shake","shakeV"],
  ["over","overV"],
  ["head","headV"],
  ["aim","aimV"]

];


function updateTune(){

  let total=0;

  tuning.forEach(item=>{

    const input =
      document.getElementById(item[0]);

    const label =
      document.getElementById(item[1]);

    label.textContent =
      input.value+"%";

    total += Number(input.value);

  });


  document.getElementById("boost")
    .textContent =
    Math.round(total/tuning.length);

}


tuning.forEach(item=>{

  document.getElementById(item[0])
    .addEventListener(
      "input",
      updateTune
    );

});


function resetTune(){

  tuning.forEach(item=>{

    document.getElementById(item[0])
      .value=0;

  });

  updateTune();

}


/* ==================================================
   ADMIN
================================================== */

function verifyAdmin(){

  const key =
    document.getElementById("adminKey")
    .value.trim();

  const status =
    document.getElementById("status");

  const panel =
    document.getElementById("adminPanel");


  /*
    ADMIN KEY MỚI
  */
  if(key === "HHOANGKHOI-ADMIN"){

    status.textContent =
      "✓ ADMIN ĐÃ XÁC THỰC";

    status.classList.add("ok");

    panel.style.display="block";

  }else{

    status.textContent =
      "✕ ADMIN KEY KHÔNG HỢP LỆ";

    status.classList.remove("ok");

    panel.style.display="none";

  }

}


/* ==================================================
   KEY GENERATOR
================================================== */

function randomPart(length){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result="";

  for(let i=0;i<length;i++){

    result +=
      chars[
        Math.floor(
          Math.random()*chars.length
        )
      ];

  }

  return result;

}


function generateKey(){

  const duration =
    document.getElementById("duration")
    .value;

  const key =
    "UTRA-"+
    duration.toUpperCase()+
    "-"+
    randomPart(4)+
    "-"+
    randomPart(4);


  const result =
    document.getElementById("result");

  result.style.display="block";

  result.textContent=key;

}


/* ==================================================
   SESSION CHECK
================================================== */

if(
  sessionStorage.getItem(
    "utralock_access"
  ) === "granted"
){

  document.getElementById("keyLogin")
    .style.display="none";

  document.getElementById("app")
    .style.display="block";

}

</script>

</body>
</html>
